<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page extend under the iPhone notch/status bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches --color-bg so Safari tints the status bar area to the page colour -->
    <meta name="theme-color" content="#1f1f38" />
    <!-- When saved to the home screen, draw the page behind the status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Godspower Abah</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
